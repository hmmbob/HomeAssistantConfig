attic_pubercave_package:
  light:
    - platform: group
      name: "Verlichting Pubercave"
      unique_id: lampen_pubercave
      entities:
        - light.sonoff_l1

  input_boolean:
    notify_power_use_attic:
      name: Waarschuwing pubercave
      icon: mdi:lightbulb-on-outline

  input_datetime:
    time_poweruse_pubercave:
      name: Tijd poweruse pubercave
      has_time: true
    time_maxi_gametime_over:
      name: Maxi gametijd over zo-do
      has_time: true
    time_maxi_gametime_over_weekend:
      name: Maxi gametijd over vr-za
      has_time: true

  sensor:
    - platform: history_stats
      name: Pubercave PC ON today
      entity_id: binary_sensor.pubercave_pc
      state: "on"
      type: time
      start: "{{ now().replace(hour=0, minute=0, second=0) }}"
      end: "{{ now() }}"
    - platform: history_stats
      name: Pubercave TV ON today
      entity_id: binary_sensor.is_pubercave_tv_on
      state: "on"
      type: time
      start: "{{ now().replace(hour=0, minute=0, second=0) }}"
      end: "{{ now() }}"
    - platform: history_stats
      name: Laptop puber aan
      entity_id: binary_sensor.laptop_m
      state: "on"
      type: time
      start: "{{ now().replace(hour=0, minute=0, second=0) }}"
      end: "{{ now() }}"

  template:
    - binary_sensor:
        - name: "Is pubercave TV on"
          unique_id: is_pubercave_TV_on
          state: "{{ states('sensor.pubercave_tv_power') | int(default=0) > 20 }}"
        - name: "Is pubercave leeslampje on"
          unique_id: is_pubercave_leeslampje_on
          state: "{{ states('sensor.leeslampje_zolder_power') | int(default=0) > 3 }}"
        - name: "Is pubercave PC on"
          unique_id: is_pubercave_pc_on
          state: "{{ states('binary_sensor.pubercave_pc') }}"

  automation:
    - id: warn_pc_time_duration_pubercave
      alias: "Waarschuwing dat de gametijd van de puber voorbij is"
      mode: queued
      triggers:
        - alias: Eindtijd gamen op zondag tot en met donderdag
          trigger: time
          at: input_datetime.time_maxi_gametime_over
          id: weekday
        - alias: Eindtijd gamen op vrijdag en zaterdag
          trigger: time
          at: input_datetime.time_maxi_gametime_over_weekend
          id: weekend
      conditions:
        - alias: Controleer of de PC aanstaat
          condition: state
          entity_id: binary_sensor.pubercave_pc
          state: "on"
        - alias: Controleer of de juiste eindtijd is bereikt
          condition: or
          conditions:
            - condition: and
              conditions:
                - condition: trigger
                  id: weekday
                - condition: time
                  weekday:
                    - sun
                    - mon
                    - tue
                    - wed
                    - thu
            - condition: and
              conditions:
                - condition: trigger
                  id: weekend
                - condition: time
                  weekday:
                    - fri
                    - sat
      actions:
        - alias: Waarschuw puber via spraak
          action: script.tts_announce
          data:
            media_player_entity_id: media_player.zolder
            message: "Je tijd is op. Sluit je af?"
        - alias: Meld aan ouders dat PC-tijd voorbij is
          action: notify.mobile_devices_adults
          data:
            title: Puber PC
            message: >-
              De puber heeft vandaag lang genoeg achter de PC gezeten ({{ now().strftime('%H:%M') }}).
            data: &puber_pc_notification_data
              tag: puber_pc
              notification_icon: mdi:desktop-classic
              priority: high
              ttl: 0
        - alias: Meld aan puber dat PC-tijd voorbij is
          action: notify.mobile_app_schaduwspeler
          data:
            title: Gametijd
            message: Je zit vandaag al lang genoeg achter de PC ({{ now().strftime('%H:%M') }}).
            data: *puber_pc_notification_data
        - alias: Sla huidige lichtstatus op
          action: scene.create
          data:
            scene_id: snapshot_pubercave
            snapshot_entities:
              - light.sonoff_l1
        - alias: Wacht 5 seconden
          delay:
            seconds: 5
        - alias: Zet licht rood met pulse effect
          action: light.turn_on
          target:
            entity_id:
              - light.sonoff_l1
          data:
            color_name: red
            effect: DIY Pulse
            brightness_pct: 100
        - alias: Wacht 15 seconden
          delay:
            seconds: 15
        - alias: Herstel vorige lichtstatus
          action: scene.turn_on
          data:
            entity_id: scene.snapshot_pubercave

    ##########################
    ## Warnings on power usage on kid's bedroom
    ##########################
    - id: warn_power_usage_after_bedtime_attic
      alias: "Waarschuwing dat de pubercave nog stroom verbruikt"
      description: >-
        Reading light: the kid shouldn't be reading after bedtime, so we track
        the power usage of his bedside light with an always on switch
        Pubercave: mancave for the adolescent kid. It has a TV that obviously
        shouldn't be on after bedtime... So let's trigger a notification if it is :)
      mode: queued
      triggers:
        - alias: Leeslampje verbruikt stroom
          trigger: power.crossed_threshold
          target:
            entity_id: sensor.leeslampje_zolder_power
          id: Leeslampje
          options:
            threshold:
              type: above
              value:
                number: 3
                unit_of_measurement: W
            for:
              minutes: 2
        - alias: TV in pubercave verbruikt stroom
          trigger: power.crossed_threshold
          target:
            entity_id: sensor.pubercave_tv_power
          id: TV
          options:
            threshold:
              type: above
              value:
                number: 25
                unit_of_measurement: W
        - alias: Laptop in pubercave wordt ingeschakeld
          trigger: state
          entity_id: binary_sensor.laptop_m
          to: "on"
          for:
            minutes: 2
          id: Laptop
      conditions:
        - alias: Meldingen voor stroomverbruik zijn ingeschakeld
          condition: state
          entity_id: input_boolean.notify_power_use_attic
          state: "on"
        - alias: Tijd is na ingestelde meldingstijd
          condition: time
          after: input_datetime.time_poweruse_pubercave
      actions:
        - alias: Stuur meldingsgebeuren voor stroomverbruik
          action: notify.mobile_devices_adults
          data:
            title: "Pubercave {{ trigger.id }}"
            message: >-
              {% if trigger.id == "Leeslampje" %}
                Het lampje op zolder staat nog aan... ({{ now().strftime('%H:%M') }}).
              {% elif trigger.id == "Laptop" %}
                De laptop van de puber staat nog aan... ({{ now().strftime('%H:%M') }}).
              {% else %}
                De TV op zolder staat nog aan... ({{ now().strftime('%H:%M') }}).
              {% endif %}
            data:
              tag: pubercave
              notification_icon: mdi:home-lightning-bolt
              ttl: 0
              priority: high

    - id: power_logging_attic
      alias: "Log stroomverbruik in de pubercave"
      description: >-
        Because the switch is always on and only used for power tracking,
        we need another way to track this switch in the logbook. We use
        25 watts as crossover point, because the PS4 sometimes charges
        the controllers and thus consumes a bit of power.
      mode: queued
      triggers:
        - alias: TV op zolder staat aan
          trigger: power.crossed_threshold
          target:
            entity_id: sensor.pubercave_tv_power
          id: pubercave
          options:
            threshold:
              type: above
              value:
                number: 25
                unit_of_measurement: W
        - alias: TV op zolder staat uit
          trigger: power.crossed_threshold
          target:
            entity_id: sensor.pubercave_tv_power
          id: pubercave
          options:
            threshold:
              type: below
              value:
                number: 25
                unit_of_measurement: W
        - alias: Leeslampje staat aan
          trigger: power.crossed_threshold
          target:
            entity_id: sensor.leeslampje_zolder_power
          id: leeslampje
          options:
            threshold:
              type: above
              value:
                number: 3
                unit_of_measurement: W
        - alias: Leeslampje staat uit
          trigger: power.crossed_threshold
          target:
            entity_id: sensor.leeslampje_zolder_power
          id: leeslampje
          options:
            threshold:
              type: below
              value:
                number: 3
                unit_of_measurement: W
      actions:
        - alias: Log stroomverbruik naar logboek
          choose:
            - conditions:
                condition: trigger
                id: pubercave
              sequence:
                - alias: Log TV stroomverbruik
                  action: logbook.log
                  data:
                    name: Pubercave zolder
                    entity_id: sensor.pubercave_tv_power
                    message: >-
                      {{ iif(states('sensor.pubercave_tv_power') | float(0) > 25, "is aan", "is uit" )}}
            - conditions:
                condition: trigger
                id: leeslampje
              sequence:
                - alias: Log leeslampje stroomverbruik
                  action: logbook.log
                  data:
                    name: Leeslampje zolder
                    entity_id: sensor.leeslampje_zolder_power
                    message: >-
                      {{ iif(states('sensor.leeslampje_zolder_power') | float(0) > 3, "is aan", "is uit" )}}
