bikeshed_package:
  alert:
    #############################
    ## Bikeshed door alert      #
    #############################
    bikeshed_door:
      name: "Fietsenhok deur"
      title: "ALARM:"
      message: "Het fietsenhok staat nog open"
      entity_id: binary_sensor.alert_bikeshed_door
      state: "on"
      repeat: 5
      can_acknowledge: true
      skip_first: false
      notifiers:
        - mobile_app_sm_a556b
      data:
        tag: bikeshed_door_alert
        ttl: 0
        channel: alerts # For devices on Android 8.0+ only
        priority: high
        notification_icon: mdi:lock-alert-outline
        ledColor: "red" # Set the LED to red
        actions:
          - action: "mute_alert_bikeshed"
            title: "Alert dempen"

  input_boolean:
    notify_door_alert:
      name: "Deur alarm"
      icon: mdi:door-open

  template:
    - binary_sensor:
        - name: "Alert bikeshed door"
          unique_id: alert_bikeshed_door
          delay_on: "00:05:00"
          state: >-
            {{ is_state('binary_sensor.fietsenhok_contact', 'on')
              and is_state('input_boolean.notify_door_alert', 'on') }}

  automation:
    - alias: "Verwijder fietsenhok alert"
      id: clear_bikeshed_door_alert
      trigger:
        - alias: Trigger fietsenhokalert gaat van aan naar uit
          platform: state
          entity_id: alert.bikeshed_door
          from: "on"
          to:
            - "idle"
            - "off"
      action:
        - alias: Verwijder fietsenhok-alarmmelding op telefoon
          service: notify.mobile_app_sm_a556b
          data:
            message: clear_notification
            data:
              tag: bikeshed_door_alert

    - alias: "Verwerk actie om alert uit te zetten"
      id: mute_door_alerts
      trigger:
        - alias: Trigger bij meldingsactie alert dempen
          platform: event
          event_type: mobile_app_notification_action
          event_data:
            action: "mute_alert_bikeshed"
      action:
        - alias: Schakel fietsenhok-alert uit
          service: alert.turn_off
          target:
            entity_id: alert.bikeshed_door

    - id: schuur_fietslader
      alias: Fietsaccu lader in de schuur uitschakelen na laden
      description: Fietsaccu lader in de schuur uitschakelen na laden
      mode: single
      triggers:
        - alias: Trigger links laderverbruik onder 5 watt
          trigger: power.crossed_threshold
          target:
            entity_id: sensor.fietslader_links_power
          variables:
            switch: switch.fietslader_links
          options:
            threshold:
              type: below
              value:
                number: 5
                unit_of_measurement: W
            for:
              minutes: 5
        - alias: Trigger rechts laderverbruik onder 5 watt
          trigger: power.crossed_threshold
          target:
            entity_id: sensor.fietslader_rechts_power
          variables:
            switch: switch.fietslader_rechts
          options:
            threshold:
              type: below
              value:
                number: 5
                unit_of_measurement: W
            for:
              minutes: 5
      conditions:
        - alias: "Niet uitvoeren bij herstart"
          condition: template
          value_template: "{{ trigger.from_state.state | is_number }}"
        - alias: "Alleen als de schakelaar nog aan staat"
          condition: template
          value_template: "{{ is_state(switch, 'on') }}"
      actions:
        - alias: "Lader uitschakelen"
          action: switch.turn_off
          target:
            entity_id: "{{ switch }}"
        - alias: "Stuur melding dat fietslader is uitgeschakeld"
          action: notify.mobile_app_sm_a556b
          data:
            title: "Fietslader uitgeschakeld"
            message: "De {{ state_attr(switch, 'friendly_name') }} is automatisch uitgeschakeld ({{ now().strftime('%H:%M') }})"
            data:
              <<: &bicycle_charger_notification_base
                notification_icon: mdi:bicycle-electric
                ttl: 0
                priority: high
              clickAction: "/lovelace/other"

    - alias: "Fietslader links aan, maar geen stroomverbruik"
      id: fietslader_links_aan_maar_geen_verbruik
      description: Controleer per inschakeling of de linker fietslader binnen vijf minuten verbruik heeft.
      mode: restart
      triggers:
        - alias: Linker fietslader ingeschakeld
          trigger: switch.turned_on
          target:
            entity_id: switch.fietslader_links
          id: "on"
        - alias: Linker fietslader uitgeschakeld
          trigger: switch.turned_off
          target:
            entity_id: switch.fietslader_links
          id: "off"
      variables:
        charger_switch: switch.fietslader_links
        power_sensor: sensor.fietslader_links_power
        charger_side: links
      actions: &bicycle_charger_no_consumption_actions
        - alias: Stop een oude controle bij uitschakelen
          condition: trigger
          id: "on"
        - alias: Controleer meteen en wacht zo nodig op geldig verbruik of uitschakelen
          wait_template: >-
            {{ not is_state(charger_switch, 'on')
              or (is_number(states(power_sensor)) and states(power_sensor) | float > 5) }}
          timeout: "00:05:00"
          continue_on_timeout: true
        - alias: Alleen waarschuwen na het verstrijken van de wachttijd
          condition: template
          value_template: "{{ not wait.completed }}"
        - alias: Bevestig dat de lader nog aan staat en het gemeten vermogen laag is
          condition: template
          value_template: >-
            {{ is_state(charger_switch, 'on')
              and is_number(states(power_sensor))
              and 0 <= states(power_sensor) | float <= 5 }}
        - alias: Stuur waarschuwing lader zonder verbruik
          action: notify.mobile_app_sm_a556b
          data:
            title: "Let op: Fietslader {{ charger_side }}"
            message: "De fietslader {{ charger_side }} is aangezet, maar er is na 5 minuten nog geen stroomverbruik boven 5 watt gedetecteerd."
            data:
              <<: *bicycle_charger_notification_base

    - alias: "Fietslader rechts aan, maar geen stroomverbruik"
      id: fietslader_rechts_aan_maar_geen_verbruik
      description: Controleer per inschakeling of de rechter fietslader binnen vijf minuten verbruik heeft.
      mode: restart
      triggers:
        - alias: Rechter fietslader ingeschakeld
          trigger: switch.turned_on
          target:
            entity_id: switch.fietslader_rechts
          id: "on"
        - alias: Rechter fietslader uitgeschakeld
          trigger: switch.turned_off
          target:
            entity_id: switch.fietslader_rechts
          id: "off"
      variables:
        charger_switch: switch.fietslader_rechts
        power_sensor: sensor.fietslader_rechts_power
        charger_side: rechts
      actions: *bicycle_charger_no_consumption_actions
