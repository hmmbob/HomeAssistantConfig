solar_package:
  binary_sensor:
    # Check if the current electricity prices are negative
    # on == negative price, off == positive price
    - platform: threshold
      name: "Negatieve stroomprijs"
      entity_id: sensor.zonneplan_current_quarter_hourly_electricity_tariff
      lower: 0

  input_boolean:
    # Do I want the PV to turn off automatically?
    solar_pv_off_automatic:
      name: "Zonnepanelen: Automatisch uitschakelen"
      icon: mdi:refresh-auto
    # Do I want the PV to turn off by schedule?
    solar_pv_off_schedule:
      name: "Zonnepanelen: Uitschakelen op schema"
      icon: mdi:calendar-start

  input_datetime:
    # When should PV off period stop (and turn on PV)
    solar_pv_off_end:
      name: "Zonnepanelen eindtijd uitschakeling"
      has_time: true
      has_date: true
      icon: mdi:clock-end
    # When should PV off period start (and turn off PV)
    solar_pv_off_start:
      name: "Zonnepanelen starttijd uitschakeling"
      has_time: true
      has_date: true
      icon: mdi:clock-start

  template:
    - sensor:
        - unit_of_measurement: kWh
          default_entity_id: sensor.todays_total_production_preserved
          name: Totale productie van vandaag behouden
          state: >-
            {% if states('sensor.today_s_pv_generation') not in ['unknown', 'unavailable'] %}
              {{ states('sensor.today_s_pv_generation') | float(0)  }}
            {% else %}
              {{ states('sensor.todays_total_production_preserved') | float(0) }}
            {% endif %}

  rest_command:
    # Rest Command to upload PV generation data to PVOutput
    update_pvoutput:
      url: https://pvoutput.org/service/r2/addstatus.jsp
      method: post
      content_type: "application/x-www-form-urlencoded"
      headers:
        X-Pvoutput-Apikey: !secret pvoutput_api_key
        X-Pvoutput-SystemId: !secret pvoutput_system_id
      payload: >-
        d={{-now().strftime("%Y%m%d")-}}
        &t={{-now().strftime("%H:%M")-}}
        &v1={{-(states('sensor.today_s_pv_generation')|float(0))*1000-}}
        &v2={{-(states('sensor.pv_power')|float(0))|round(0)-}}
        &v5={{-states('sensor.weer_thuis_temperatuur')|float(0)-}}
        &v6={{-states('sensor.on_grid_l1_voltage')|float(0)-}}

  automation:
    # Automation to trigger the upload to PVOutput, using the rest_command defined above
    - id: solar_upload_to_pvoutput
      alias: "Stuur solar informatie naar PVOutput"
      description: Stuur waarden naar PVOutput
      triggers:
        - trigger: time_pattern
          minutes: /5
          seconds: "0"
      conditions:
        - condition: state
          entity_id: sensor.work_mode
          state: "Normal"
      actions:
        - action: rest_command.update_pvoutput
          data: {}
      mode: single

    - id: solar_handle_pv_off
      alias: "Beheer automatische PV-schakeling"
      description: >-
        Automatisering om mijn zonnesysteem automatisch uit te schakelen wanneer de elektriciteitsprijzen 
        onder nul liggen. Dit kan automatisch of op basis van een tijdschema via input_datetime plaatsvinden.
        Het werkt door de "grid_export_limit" in de GoodWe-integratie op 0% in te stellen, waardoor
        de omvormer geen vermogen mag produceren. Door dit op 100% in te stellen, wordt de productie
        weer herstart tot de maximale capaciteit van de omvormer.
      mode: queued
      triggers:
        - alias: Stroomprijsstatus verandert of herstelt
          trigger: state
          entity_id: binary_sensor.negatieve_stroomprijs
          to: null
          id: price_changed
        - alias: Automatische of geplande regeling wordt ingeschakeld
          trigger: state
          entity_id:
            - input_boolean.solar_pv_off_automatic
            - input_boolean.solar_pv_off_schedule
          to: "on"
          id: controls_on
        - alias: Automatische of geplande regeling wordt uitgeschakeld
          trigger: state
          entity_id:
            - input_boolean.solar_pv_off_automatic
            - input_boolean.solar_pv_off_schedule
          from: "on"
          to: "off"
          id: controls_off
        - alias: Geplande periode wordt gewijzigd
          trigger: state
          entity_id:
            - input_datetime.solar_pv_off_start
            - input_datetime.solar_pv_off_end
          to: null
          id: schedule_changed
        - alias: Begin of einde van de geplande periode
          trigger: time
          at:
            - input_datetime.solar_pv_off_start
            - input_datetime.solar_pv_off_end
          id: scheduled_boundary
        - alias: Home Assistant start op
          trigger: homeassistant
          event: start
          id: resync
        - alias: Automatiseringen worden herladen
          trigger: event
          event_type: automation_reloaded
          id: resync
        - alias: Omvormer wordt operationeel
          trigger: state
          entity_id: sensor.work_mode
          to: "Normal"
          id: resync
        - alias: Instelling wordt beschikbaar
          trigger: state
          entity_id: number.grid_export_limit
          to: null
          id: target_changed
      actions:
        - alias: Reageer bij de instelling alleen op beschikbaarheidsherstel
          condition: or
          conditions:
            - condition: not
              conditions:
                - condition: trigger
                  id: target_changed
            - condition: template
              value_template: >-
                {{ trigger.from_state is none or trigger.from_state.state in ['unknown', 'unavailable'] }}
        - alias: Bepaal alle actieve redenen op basis van de huidige toestand
          variables:
            automatic_enabled: "{{ is_state('input_boolean.solar_pv_off_automatic', 'on') }}"
            schedule_enabled: "{{ is_state('input_boolean.solar_pv_off_schedule', 'on') }}"
            schedule_start: "{{ state_attr('input_datetime.solar_pv_off_start', 'timestamp') }}"
            schedule_end: "{{ state_attr('input_datetime.solar_pv_off_end', 'timestamp') }}"
            now_ts: "{{ as_timestamp(now()) }}"
            schedule_valid: >-
              {{ has_value('input_datetime.solar_pv_off_start') and has_value('input_datetime.solar_pv_off_end')
                and is_number(schedule_start) and is_number(schedule_end) and schedule_end > schedule_start }}
            schedule_active: "{{ schedule_enabled and schedule_valid and schedule_start <= now_ts < schedule_end }}"
            schedule_expired: "{{ schedule_enabled and schedule_valid and now_ts >= schedule_end }}"
            automatic_active: "{{ automatic_enabled and is_state('binary_sensor.negatieve_stroomprijs', 'on') }}"
            desired_limit: "{{ 0 if automatic_active or schedule_active else 100 }}"
        - alias: Sluit ook een tijdens uitval afgelopen eenmalig schema af
          if:
            - "{{ schedule_expired }}"
          then:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.solar_pv_off_schedule
        - alias: Regel alleen als een regeling aan staat of bewust is uitgezet
          condition: or
          conditions:
            - "{{ automatic_enabled or schedule_enabled }}"
            - condition: trigger
              id: controls_off
        - alias: Beide schakelaars moeten een geldige toestand hebben
          condition: state
          entity_id:
            - input_boolean.solar_pv_off_automatic
            - input_boolean.solar_pv_off_schedule
          state:
            - "on"
            - "off"
        - alias: Geef niet vrij zolang een ingeschakelde reden onbekend is
          condition: template
          value_template: >-
            {{ desired_limit == 0 or
              ((not automatic_enabled or states('binary_sensor.negatieve_stroomprijs') in ['on', 'off'])
                and (not schedule_enabled or schedule_valid)) }}
        - alias: Controleer of omvormer operationeel is
          condition: state
          entity_id: sensor.work_mode
          state: "Normal"
        - alias: Controleer of de instelling beschikbaar is en moet veranderen
          condition: template
          value_template: >-
            {{ is_number(states('number.grid_export_limit'))
              and states('number.grid_export_limit') | float != desired_limit }}
        - alias: Pas de gezamenlijke beslissing toe
          action: number.set_value
          target:
            entity_id: number.grid_export_limit
          data:
            value: "{{ desired_limit }}"
        - alias: Stuur pushmelding over PV-status
          action: notify.mobile_app_sm_a556b
          data:
            title: "Zonnepanelen update"
            message: >-
              {% if automatic_active and schedule_active %}
                Je zonnepanelen zijn uitgeschakeld op basis van je schedule en omdat de stroomprijs negatief is.
              {% elif automatic_active %}
                Je zonnepanelen zijn automatisch uitgeschakeld omdat de stroomprijs negatief is.
              {% elif schedule_active %}
                Je zonnepanelen zijn uitgeschakeld op basis van je schedule.
              {% else %}
                Je zonnepanelen zijn weer ingeschakeld omdat er geen actieve uitschakelreden meer is.
              {% endif %}
            data:
              tag: "notification-solar"
              notification_icon: mdi:solar-power-variant
              ttl: 0
              priority: high
              clickAction: "/lovelace-admin/solar"

    - id: goodwe_inverter_data_polling
      alias: "GoodWe omvormer data opvragen"
      description: "Werkt de GoodWe-omvormergegevens elke 30 seconden bij door sensor.pv_power te verversen."
      triggers:
        - trigger: time_pattern
          alias: "Elke 30 seconden"
          seconds: "/30"
      conditions:
        - alias: "Controleer of sensor.pv_power beschikbaar is"
          condition: template
          value_template: "{{ states('sensor.pv_power') not in ['unknown', 'unavailable'] }}"
      actions:
        - alias: "Ververs sensor PV-vermogen"
          action: homeassistant.update_entity
          target:
            entity_id: sensor.pv_power

    - id: goodwe_inverter_polling_sun_control
      alias: "GoodWe polling in-/uitschakelen op basis van zon"
      description: "Schakelt de GoodWe data polling uit 30 minuten na zonsondergang en in 30 minuten voor zonsopgang."
      mode: single
      triggers:
        - trigger: sun.sunset
          options:
            offset: 00:30:00
            offset_type: after
          id: disable
        - trigger: sun.sunrise
          options:
            offset: 00:30:00
            offset_type: before
          id: enable
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id: disable
              sequence:
                - action: automation.turn_off
                  target:
                    entity_id:
                      - automation.goodwe_integratie_proberen_te_herstellen
                      - automation.goodwe_omvormer_data_opvragen
                      - automation.power_pvoutput_uploader
            - conditions:
                - condition: trigger
                  id: enable
              sequence:
                - action: automation.turn_on
                  target:
                    entity_id:
                      - automation.goodwe_integratie_proberen_te_herstellen
                      - automation.goodwe_omvormer_data_opvragen
                      - automation.power_pvoutput_uploader

    - id: goodwe_config_entry_check
      alias: "GoodWe integratie proberen te herstellen"
      description: "Herlaad de GoodWe-configuratie wanneer de PV-vermogen sensor niet beschikbaar is, wat kan duiden op een probleem met de integratie."
      triggers:
        - trigger: time_pattern
          alias: "Elke 15 minuten"
          minutes: "/15"
      conditions:
        - condition: sun
          after: sunrise
          after_offset: "-00:30:00"
          before: sunset
          before_offset: "00:30:00"
        - alias: "Controleer of sensor.pv_power beschikbaar is"
          condition: template
          value_template: "{{ states('sensor.pv_power') in ['unknown', 'unavailable'] }}"
      actions:
        - alias: "Herlaad GoodWe-configuratie"
          action: homeassistant.reload_config_entry
          data:
            entry_id: 01KPNADWPAX2PZX3JXY7VBA5HA
