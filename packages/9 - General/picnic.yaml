picnic_package:
  template:
    - sensor:
        - name: "Picnic maximale besteltijd laatste bestelling"
          unique_id: picnic_last_order_max_order_time_only
          availability: "{{ has_value('sensor.picnic_max_order_time_of_last_order') }}"
          state: >-
            {{ as_timestamp(states('sensor.picnic_max_order_time_of_last_order')) | timestamp_custom('%H:%M') }}
        - name: "Picnic verwachte bezorgtijd"
          unique_id: picnic_next_delivery_eta
          availability: "{{ has_value('sensor.picnic_estimated_arrival_of_next_delivery') }}"
          state: >-
            {{ as_timestamp(states('sensor.picnic_estimated_arrival_of_next_delivery')) | timestamp_custom('%H:%M') }}

  timer:
    picnic:
      name: "Timer Picnic kiosk"
      restore: true

  script:
    picnic_close_dashboard:
      alias: "Picnic: Sluit kioskscherm"
      description: Ga terug naar het kiosk-specifieke startscherm op basis van de browser die de actie startte.
      fields:
        browser_id:
          name: Browser ID
          description: Browser Mod browser_id van het scherm dat de actie start.
          required: true
          selector:
            text:
      sequence:
        - alias: Kies kiosk-specifiek startscherm
          if: "{{ browser_id == 'kiosk2' }}"
          then:
            - alias: Ga terug naar TSV2
              action: browser_mod.navigate
              data:
                path: "/tsv-dashboards/tsv2"
                browser_id:
                  - "{{ browser_id }}"
          else:
            - alias: Ga terug naar TSV1
              action: browser_mod.navigate
              data:
                path: "/tsv-dashboards/tsv1"
                browser_id:
                  - "{{ browser_id }}"

  automation:
    - id: picnic_order_window_closing
      alias: "Picnic: Bestelvenster sluit binnenkort"
      mode: single
      max_exceeded: silent
      description: Toon het Picnic-kioskscherm wanneer er nog 4 uur resteert om de bestelling in te dienen
      triggers:
        - alias: 4 uur voor maximale besteltijd van huidig slot
          trigger: time
          at:
            entity_id: sensor.picnic_maximale_besteltijd_voor_het_geselecteerde_tijdslot
            offset: "-04:00:00"
        - alias: 4 uur voor besteldeadline van laatste bestelling
          trigger: time
          at:
            entity_id: sensor.picnic_max_order_time_of_last_order
            offset: "-04:00:00"
      action:
        - alias: "Schakel bewegingsdetectie & eventuele screensaver uit"
          action: homeassistant.turn_off
          data:
            entity_id:
              - switch.kiosk1_bewegingsdetectie
              - switch.kiosk2_bewegingsdetectie
              - switch.kiosk1_screensaver
              - switch.kiosk2_screensaver
        - alias: "Schakel screensaver timeout uit"
          action: number.set_value
          data:
            value: 0
          target:
            entity_id:
              - number.kiosk1_screensaver_timer
              - number.kiosk2_screensaver_timer
        - alias: "Zet schermhelderheid op goed leesbaar niveau"
          action: number.set_value
          data:
            value: "{{255 if is_state('sun.sun', 'above_horizon') else 125}}"
          target:
            entity_id:
              - number.kiosk1_schermhelderheid
              - number.kiosk2_schermhelderheid
        - alias: "Laat dashboard zien op kiosk"
          action: browser_mod.navigate
          data:
            path: "/tsv-dashboards/picnic-order-closing"
            browser_id:
              - kiosk1
              - kiosk2
        - alias: Start Picnic-kiosktimer van 30 minuten
          action: timer.start
          target:
            entity_id: timer.picnic
          data:
            duration: "00:30:00"

    - id: picnic_delivery_known
      alias: "Picnic: Bezorging binnenkort"
      mode: single
      max_exceeded: silent
      description: Toon het Picnic-kioskscherm 15 minuten voor de verwachte bezorgtijd
      triggers:
        - alias: 15 minuten voor de verwachte bezorgtijd
          trigger: time
          at:
            entity_id: sensor.picnic_estimated_arrival_of_next_delivery
            offset: "-00:15:00"
      action:
        - alias: "Schakel bewegingsdetectie uit"
          action: homeassistant.turn_off
          data:
            entity_id:
              - switch.kiosk1_bewegingsdetectie
              - switch.kiosk2_bewegingsdetectie
              - switch.kiosk1_screensaver
              - switch.kiosk2_screensaver
        - alias: "Schakel screensaver timeout uit"
          action: number.set_value
          data:
            value: 0
          target:
            entity_id:
              - number.kiosk1_screensaver_timer
              - number.kiosk2_screensaver_timer
        - alias: "Zet schermhelderheid op goed leesbaar niveau"
          action: number.set_value
          data:
            value: "{{255 if is_state('sun.sun', 'above_horizon') else 125}}"
          target:
            entity_id:
              - number.kiosk1_schermhelderheid
              - number.kiosk2_schermhelderheid
        - alias: "Laat dashboard zien op kiosk"
          action: browser_mod.navigate
          data:
            path: "/tsv-dashboards/picnic-eta"
            browser_id:
              - kiosk1
              - kiosk2
        - alias: Start Picnic-kiosktimer van 30 minuten
          action: timer.start
          target:
            entity_id: timer.picnic
          data:
            duration: "00:30:00"

    - id: picnic_delivery_complete
      alias: "Picnic: Bezorging voltooid"
      triggers:
        - alias: Status gaat van CURRENT naar COMPLETED
          trigger: state
          entity_id: sensor.picnic_status_van_de_laatste_bestelling
          to: "COMPLETED"
          from: "CURRENT"
      actions:
        - alias: Rond Picnic-kiosktimer direct af
          action: timer.finish
          target:
            entity_id: timer.picnic

    - id: picnic_reset_view
      alias: "Kiosk: Terug van Picnic naar startscherm"
      mode: queued
      triggers:
        - alias: Picnic timer is afgelopen
          trigger: event
          event_type: timer.finished
          event_data:
            entity_id: timer.picnic
      actions:
        - alias: "Ga weer terug naar startscherm"
          action: script.picnic_close_dashboard
          data:
            browser_id: kiosk1
        - alias: "Ga ook op kiosk 2 terug naar startscherm"
          action: script.picnic_close_dashboard
          data:
            browser_id: kiosk2
        - alias: "Schakel bewegingsdetectie in"
          action: homeassistant.turn_on
          data:
            entity_id:
              - switch.kiosk1_bewegingsdetectie
              - switch.kiosk2_bewegingsdetectie
        - alias: "Schakel screensaver timeout in"
          action: number.set_value
          data:
            value: 120
          target:
            entity_id:
              - number.kiosk1_screensaver_timer
              - number.kiosk2_screensaver_timer
