kiosk_package:
  binary_sensor:
    - platform: tod
      name: Vaatwasser periode
      after: "17:00"
      before: "22:00"
      unique_id: vaatwasser_periode

  # The icon and diagnostic attribute need YAML; message priority is shared in one macro.
  template:
    - sensor:
        - name: Kiosk melding
          unique_id: kiosk_melding
          state: >-
            {% from "kiosk_notification.jinja" import macro_kiosk_notification %}
            {% set notification = macro_kiosk_notification | as_function %}
            {{ notification().text }}
          icon: >-
            {% from "kiosk_notification.jinja" import macro_kiosk_notification %}
            {% set notification = macro_kiosk_notification | as_function %}
            {{ notification().icon }}
          attributes:
            soort: >-
              {% from "kiosk_notification.jinja" import macro_kiosk_notification %}
              {% set notification = macro_kiosk_notification | as_function %}
              {{ notification().kind }}

  input_select:
    kiosk_announcement:
      name: "Kioskmelding aan het afspelen"
      options:
        - tafeldekken
        - dinner_time
        - 5min_warning
        - stairs
        - geen
        - maxi
        - mini

  light:
    - platform: group
      name: "Verlichting voor gebruik op kiosk"
      unique_id: groep_verlichting_voor_kiosk
      entities:
        - light.eetkamer_tafel
        - light.spots_eetkamer
        - light.spots_keuken
        - light.spots_vaas
        - light.spots_woonkamer

  script:
    kiosk_toggle_airco:
      alias: Toggle airco vanaf kiosk
      description: "Schakel de airco om vanaf de kiosk"
      icon: mdi:hvac
      mode: single
      max_exceeded: silent
      sequence:
        - variables:
            room_temperature: "{{ states('sensor.temp_sensor_7_woonkamer_temperatuur') }}"
        - alias: Controleer bereikbaarheid voordat de airco wordt bediend
          if:
            - "{{ not has_value('climate.airco_woonkamer') }}"
          then:
            - stop: "Woonkamerairco niet beschikbaar"
        - alias: Een ontbrekende meting mag inschakelen blokkeren, uitschakelen blijft mogelijk
          if:
            - condition: state
              entity_id: climate.airco_woonkamer
              state: "off"
            - "{{ not is_number(room_temperature) }}"
          then:
            - stop: "Geen geldige kamertemperatuur"
        - alias: Zet woonkamerairco aan of uit vanaf kiosk
          action: climate.set_hvac_mode
          data:
            hvac_mode: >-
              {% if is_state('climate.airco_woonkamer', 'off') %}
                {{ 'heat' if (room_temperature | float) < 22 else 'cool' }}
              {% else %}
                off
              {% endif %}
          target:
            entity_id: climate.airco_woonkamer

    kiosk_announcement:
      alias: Omroep vanaf de kiosk
      mode: single
      max_exceeded: silent
      fields:
        announcement:
          description: "Welk omroepbericht"
          example: "tafeldekken"
      variables:
        # Map announcements to their messages
        messages:
          tafeldekken: "{{ states('input_select.tafeldekken_beurt') }}, kom je tafel dekken?"
          dinner_time: "Het eten is klaar. Komen jullie naar beneden?"
          5min_warning: "Over 5 minuten is het eten klaar."
          stairs: "Komen jullie naar beneden?"
          maxi: "{{states('input_text.naam_puber')}}, kom je naar beneden?"
          mini: "{{states('input_text.naam_mini')}}, kom je naar beneden?"
        # Map announcements to their speakers
        players:
          tafeldekken: >-
            {%- set child = states('input_select.tafeldekken_beurt')[0] -%}
            {%- if child == 'M' %}media_player.zolder
            {%- elif child == 'T' %}media_player.slaapkamer_t
            {%- else %}media_player.boven{% endif %}
          dinner_time: "media_player.boven"
          5min_warning: "media_player.boven"
          stairs: "media_player.boven"
          maxi: "media_player.zolder"
          mini: "media_player.slaapkamer_t"
        message: "{{ messages.get(announcement, '') }}"
        player: "{{ players.get(announcement, 'media_player.boven') }}"
      sequence:
        - alias: Sla gekozen omroepbericht op in helper
          action: input_select.select_option
          target:
            entity_id: input_select.kiosk_announcement
          data:
            option: "{{ announcement }}"
        - alias: "Speel TTS af"
          action: script.tts_announce
          data:
            media_player_entity_id: "{{ player }}"
            message: "{{ message }}"
        - alias: Wacht 5 seconden tot TTS is gestart
          delay:
            seconds: 5
        - alias: Herstel helper naar geen actieve omroep
          action: input_select.select_option
          target:
            entity_id: input_select.kiosk_announcement
          data:
            option: "geen"

  automation:
    - id: kiosk1_screen
      alias: "Schakel het scherm van kiosk 1 in of uit"
      mode: restart
      triggers:
        - alias: Lampen in woonkamer zijn uit
          trigger: light.turned_off
          target:
            entity_id: light.verlichting_woonkamer
          id: turn_off
        - alias: "Dagelijks scherm uit om 23:00"
          trigger: time
          at: "23:00:00"
          id: "turn_off"
        - alias: "Dagelijks scherm aan om 06:30"
          trigger: time
          at: "06:30:00"
          id: "turn_on"
      actions:
        - alias: Schakel kiosk 1 scherm uit of in op basis van trigger
          choose:
            - conditions:
                - condition: trigger
                  id: "turn_off"
                - alias: Controleer dat het na 21:00 is
                  condition: time
                  after: "21:00:00"
              sequence:
                - alias: Geef tijd voor de laatste handelingen op het scherm
                  delay: "00:00:10"
                - alias: Schakel kiosk 1 scherm uit voor de nacht
                  action: light.turn_off
                  target:
                    entity_id: light.kiosk_1_keuken_screen
            - conditions:
                - condition: trigger
                  id: "turn_on"
              sequence:
                - alias: Schakel kiosk 1 scherm in
                  action: light.turn_on
                  target:
                    entity_id: light.kiosk_1_keuken_screen
                - alias: Toon het dashboard in plaats van de lokale screensaver
                  action: switch.turn_off
                  target:
                    entity_id: switch.kiosk_1_keuken_screensaver_active

    - id: kiosk2_screen
      alias: "Schakel het scherm van kiosk 2 in of uit"
      mode: restart
      triggers:
        - alias: Kantoor bureaumonitor is ingeschakeld
          trigger: power.crossed_threshold
          target:
            entity_id: sensor.bureau_kantoor_power
          id: turn_on
          options:
            threshold:
              type: above
              value:
                number: 50
                unit_of_measurement: W
        - alias: Kantoor bureaumonitor is uitgeschakeld
          trigger: power.crossed_threshold
          target:
            entity_id: sensor.bureau_kantoor_power
          id: turn_off
          options:
            threshold:
              type: below
              value:
                number: 50
                unit_of_measurement: W
            for: 00:05:00
        - alias: "Dagelijks scherm uit om 22:00"
          trigger: time
          at: "22:00:00"
          id: "turn_off"
      actions:
        - alias: Schakel kiosk 2 scherm uit of in op basis van trigger
          if:
            - condition: trigger
              id: "turn_on"
            - condition: time
              after: "07:30:00"
              before: "22:00:00"
          then:
            - alias: Schakel kiosk 2 scherm in
              action: light.turn_on
              target:
                entity_id: light.kiosk_2_kantoor_screen
          else:
            - alias: Schakel kiosk 2 scherm uit
              action: light.turn_off
              target:
                entity_id: light.kiosk_2_kantoor_screen

    - id: kiosk_automatic_updates
      alias: 'Kiosken: automatische updates om 19:00'
      description: Controleert dagelijks om 19:00 op Kiosk Satellite-updates voor Keuken en Kantoor. Start
        eerst via ADB de optionele update-helper en installeert alleen nadat deze bevestigt klaar te zijn.
        ADB via netwerk moet beschikbaar blijven, ook na een herstart. Google-accounts blijven behouden.
      triggers:
        - trigger: time
          at: '19:00:00'
          alias: Dagelijks kioskonderhoud om 19:00
      conditions: []
      actions:
        - parallel:
            - sequence:
                - action: androidtv.adb_command
                  target:
                    entity_id: media_player.android_tv_192_168_88_124
                  data:
                    command: content read --uri content://me.jxl.kiosk_satellite.update-helper/start | sh
                  alias: Start of controleer de update-helper
                - action: homeassistant.update_entity
                  target:
                    entity_id: update.kiosk_1_keuken_update
                  alias: Controleer op een nieuwe Kiosk Satellite-versie
                - if:
                    - condition: state
                      entity_id: update.kiosk_1_keuken_update
                      state: 'on'
                      alias: Er is een update beschikbaar
                    - condition: state
                      entity_id: update.kiosk_1_keuken_update
                      attribute: in_progress
                      state: false
                      alias: Er loopt nog geen installatie
                  then:
                    - if:
                        - condition: state
                          entity_id: media_player.android_tv_192_168_88_124
                          attribute: adb_response
                          state:
                            - |-
                              ready
                              Kiosk Satellite update helper started. Run this command again after a reboot.
                            - |-
                              ready
                              Kiosk Satellite update helper is already running.
                      then:
                        - action: update.install
                          target:
                            entity_id: update.kiosk_1_keuken_update
                          alias: Installeer de beschikbare update zonder schermbevestiging
                      alias: Controleer dat de update-helper klaar is
                  alias: Installeer alleen een beschikbare update die nog niet loopt
              alias: Kiosk 1 - Keuken
            - sequence:
                - action: androidtv.adb_command
                  target:
                    entity_id: media_player.android_tv_192_168_88_125
                  data:
                    command: content read --uri content://me.jxl.kiosk_satellite.update-helper/start | sh
                  alias: Start of controleer de update-helper
                - action: homeassistant.update_entity
                  target:
                    entity_id: update.kiosk_2_kantoor_update
                  alias: Controleer op een nieuwe Kiosk Satellite-versie
                - if:
                    - condition: state
                      entity_id: update.kiosk_2_kantoor_update
                      state: 'on'
                      alias: Er is een update beschikbaar
                    - condition: state
                      entity_id: update.kiosk_2_kantoor_update
                      attribute: in_progress
                      state: false
                      alias: Er loopt nog geen installatie
                  then:
                    - if:
                        - condition: state
                          entity_id: media_player.android_tv_192_168_88_125
                          attribute: adb_response
                          state:
                            - |-
                              ready
                              Kiosk Satellite update helper started. Run this command again after a reboot.
                            - |-
                              ready
                              Kiosk Satellite update helper is already running.
                      then:
                        - action: update.install
                          target:
                            entity_id: update.kiosk_2_kantoor_update
                          alias: Installeer de beschikbare update zonder schermbevestiging
                      alias: Controleer dat de update-helper klaar is
                  alias: Installeer alleen een beschikbare update die nog niet loopt
              alias: Kiosk 2 - Kantoor
          alias: Werk beide kiosken onafhankelijk bij
      mode: single
