morning_briefing_package:
  ##########################
  ## Sends a morning briefing message to my phone
  ##########################
  input_datetime:
    time_morning_briefing:
      name: Start morning briefing
      has_time: true

  automation:
    - id: morning_briefing
      alias: "Verstuur ochtendbriefing"
      description: "Notifications: Morning briefing"
      triggers:
        alias: Trigger op de ingestelde tijd
        trigger: time
        at: input_datetime.time_morning_briefing
      conditions:
        - alias: Voorwaarde vakantiemodus afwezig is uit
          condition: state
          entity_id: input_boolean.vacation_mode_away
          state: "off"
      actions:
        - alias: Begin zonder weer- of AI-antwoord
          variables:
            weather_forecast: {}
            response: {}
        - alias: Haal NL Weather dagverwachting op
          action: weather.get_forecasts
          target:
            entity_id: weather.verwachtingen
          data:
            type: daily
          response_variable: weather_forecast
          continue_on_error: true
        - alias: Kies alleen de dagverwachting voor vandaag
          variables:
            forecast_today: >-
              {% set weather = weather_forecast.get('weather.verwachtingen', {}) if weather_forecast is mapping else {} %}
              {% set forecasts = weather.get('forecast', []) if weather is mapping else [] %}
              {% set forecasts = forecasts if forecasts is sequence and forecasts is not string and forecasts is not mapping else [] %}
              {% set ns = namespace(today={}) %}
              {% for forecast in forecasts if forecast is mapping %}
                {% set date = as_datetime(forecast.get('datetime'), none) %}
                {% if date is not none and as_local(date).date() == now().date() %}
                  {% set ns.today = forecast %}
                {% endif %}
              {% endfor %}
              {{ ns.today }}
        - alias: Maak een lokale weersamenvatting van beschikbare gegevens
          variables:
            weather_summary: >-
              {% set conditions = {'sunny': 'zonnig', 'partlycloudy': 'half bewolkt', 'cloudy': 'bewolkt',
                'rainy': 'regenachtig', 'pouring': 'hevige regen', 'snowy': 'sneeuw',
                'snowy-rainy': 'natte sneeuw', 'lightning': 'onweer', 'lightning-rainy': 'onweer met regen',
                'clear-night': 'helder', 'fog': 'mistig', 'windy': 'winderig', 'windy-variant': 'bewolkt en winderig',
                'exceptional': 'uitzonderlijk weer'} %}
              {% set rising = as_datetime(states('sensor.sun_next_rising'), none) %}
              {% set condition = states('weather.weer_thuis_waarnemingen') %}
              {% set summary %}
                {% if rising is not none and as_local(rising).date() == now().date() %}
                  De zon komt vandaag op om {{ as_local(rising).strftime('%H:%M') }}.
                {% endif %}
                {% if is_number(states('sensor.weer_thuis_temperatuur')) %}
                  Buiten is het {{ states('sensor.weer_thuis_temperatuur', with_unit=True) }}.
                {% else %}
                  De buitentemperatuur is momenteel niet beschikbaar.
                {% endif %}
                {% if condition in conditions %}
                  Het is {{ conditions[condition] }}.
                {% endif %}
                {% if is_number(forecast_today.get('temperature')) %}
                  Vandaag wordt het maximaal {{ forecast_today.temperature }} °C.
                {% elif is_number(states('sensor.weer_thuis_vandaag_maximum')) %}
                  Vandaag wordt het maximaal {{ states('sensor.weer_thuis_vandaag_maximum', with_unit=True) }}.
                {% endif %}
                {% if forecast_today %}
                  {% if forecast_today.get('condition') in conditions %}
                    De verwachting voor vandaag is {{ conditions[forecast_today.condition] }}.
                  {% endif %}
                  {% if is_number(forecast_today.get('templow')) %}
                    De minimumtemperatuur is {{ forecast_today.templow }} °C.
                  {% endif %}
                  {% if is_number(forecast_today.get('precipitation_probability')) %}
                    Er is {{ forecast_today.precipitation_probability }}% kans op neerslag.
                  {% endif %}
                  {% if is_number(forecast_today.get('precipitation')) %}
                    Er wordt {{ forecast_today.precipitation }} mm neerslag verwacht.
                  {% endif %}
                {% else %}
                  De dagverwachting is momenteel niet beschikbaar.
                {% endif %}
              {% endset %}
              {{ summary.split() | join(' ') }}
        - alias: Genereer ochtendbriefing
          action: ai_task.generate_data
          response_variable: response
          continue_on_error: true
          data: &morning_ai_request
            entity_id: ai_task.google_ai_task
            task_name: Ochtendbriefing
            instructions: |
              Schrijf een korte, vriendelijke ochtendbriefing in het Nederlands.
              Gebruik alleen gewone tekst, zonder markdown, vetgedrukte tekst of kopjes.
              Baseer je uitsluitend op onderstaande gegevens; verzin geen ontbrekende waarden of zonopkomsttijd.
              {{ weather_summary }}
        - alias: Probeer ochtendbriefing opnieuw na een tijdelijke AI-fout
          if:
            - >-
              {% set result = response.get('data', '') if response is mapping else '' %}
              {{ result is not string or result | trim | length == 0 }}
          then:
            - alias: Wacht kort voor tweede AI-poging
              delay: "00:00:05"
            - alias: Genereer ochtendbriefing opnieuw
              action: ai_task.generate_data
              response_variable: response
              continue_on_error: true
              data: *morning_ai_request
        - alias: Kies AI-briefing of lokale weersamenvatting
          variables:
            briefing_message: >-
              {% set result = response.get('data', '') if response is mapping else '' %}
              {% if result is string and result | trim | length > 0 %}
                {{ result | trim }}
              {% else %}
                Goedemorgen! {{ weather_summary }}
              {% endif %}
        - alias: Stuur ochtendmelding
          action: notify.mobile_app_sm_a556b
          data:
            title: Good morning sunshine!
            message: "{{ briefing_message }}"
            data:
              tag: "morning-brief"
              notification_icon: mdi:weather-sunset-up
