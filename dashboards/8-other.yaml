####################
# Other settings   #
####################
path: other
title: Other settings
icon: mdi:help
visible: false
cards:
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Overige instellingen
        alignment: justify
      - type: custom:mushroom-chips-card
        uix:
          style:
            mushroom-template-chip:nth-child(3)$: |
              ha-state-icon {
              {% if is_state('fan.open_air_mini', 'on')%}
                  animation: rotate {{0.5 / (state_attr('fan.open_air_mini', 'percentage')/100) | round(1, default=1)}}s infinite linear }
              @keyframes rotate {
                  0% { transform: rotate(0deg); }
                  100% { transform: rotate(359deg); }
              {% endif %}
              }
        chips:
          - type: template
            icon: mdi:arrow-left
            tap_action:
              action: navigate
              navigation_path: /lovelace/start
          - type: template
            icon: mdi:account-voice
            icon_color: "grey"
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Speel een bericht af
                  content:
                    type: vertical-stack
                    cards:
                      - type: entities
                        state_color: true
                        entities:
                          - input_select.tts_target
                          - input_text.tts_message
                          - entity: script.play_tts_message
                            icon: mdi:account-voice
                            name: "Speel bericht af"
                      - type: heading
                        heading: Standaard meldingen
                      - !include common/omroep-meldingen-grid.yaml

          - type: template
            icon: mdi:fan
            icon_color: |-
              {{ "green" if is_state('fan.open_air_mini', 'on') else "grey" }}
            tap_action: !include common/tap-action-fan.yaml
          - type: conditional
            conditions:
              - condition: user
                users:
                  - 40059eb4e4d142688185485ed2e1ebbb # BV
                  - 510b1afef60640d7a220711c50b2192a # BL
            chip:
              type: template
              icon: mdi:cog
              icon_color: grey
              tap_action:
                action: fire-dom-event
                browser_mod:
                  service: browser_mod.popup
                  data:
                    title: Instellingen
                    content:
                      type: grid
                      columns: 2
                      square: false
                      cards:
                        - type: custom:mushroom-template-card
                          entity: input_boolean.enable_deurbel
                          primary: &settings_toggle_primary |-
                            {{ state_attr(entity, 'friendly_name') }}
                          secondary: "Zet deurbel aan/uit"
                          multiline_secondary: &settings_toggle_multiline_secondary true
                          icon: |-
                            {{ "mdi:bell-ring-outline" if is_state(entity, 'on') else "mdi:bell-off-outline" }}
                          icon_color: &settings_toggle_icon_color |-
                            {{ "yellow" if is_state(entity, 'on') else "grey" }}
                          layout: &settings_toggle_layout vertical
                          tap_action: &settings_toggle_tap_action
                            action: toggle
                          hold_action: &settings_toggle_hold_action
                            action: more-info
                        - type: custom:mushroom-template-card
                          entity: input_boolean.vacuum_enable_ask_for_cleaning
                          primary: *settings_toggle_primary
                          secondary: "Dagelijkse herinnering voor Rocky"
                          multiline_secondary: *settings_toggle_multiline_secondary
                          icon: |-
                            {{ "mdi:robot-vacuum" if is_state(entity, 'on') else "mdi:robot-vacuum-off" }}
                          icon_color: *settings_toggle_icon_color
                          layout: *settings_toggle_layout
                          tap_action: *settings_toggle_tap_action
                          hold_action: *settings_toggle_hold_action
                        - type: custom:mushroom-template-card
                          entity: input_boolean.notify_power_use_attic
                          primary: *settings_toggle_primary
                          secondary: "Stroomverbruik op zolder"
                          multiline_secondary: *settings_toggle_multiline_secondary
                          icon: |-
                            {{ "mdi:message-alert-outline" if is_state(entity, 'on') else "mdi:message-off-outline" }}
                          icon_color: *settings_toggle_icon_color
                          layout: *settings_toggle_layout
                          tap_action: *settings_toggle_tap_action
                          hold_action: *settings_toggle_hold_action
                        - type: custom:mushroom-template-card
                          entity: input_boolean.notify_power_use_minicave
                          primary: *settings_toggle_primary
                          secondary: "Stroomverbruik bij de mini"
                          multiline_secondary: *settings_toggle_multiline_secondary
                          icon: |-
                            {{ "mdi:message-alert-outline" if is_state(entity, 'on') else "mdi:message-off-outline" }}
                          icon_color: *settings_toggle_icon_color
                          layout: *settings_toggle_layout
                          tap_action: *settings_toggle_tap_action
                          hold_action: *settings_toggle_hold_action
                        - type: custom:mushroom-template-card
                          entity: input_boolean.notify_trash
                          primary: *settings_toggle_primary
                          secondary: "Welke container moet er naar buiten?"
                          multiline_secondary: *settings_toggle_multiline_secondary
                          icon: |-
                            {{ "mdi:delete" if is_state(entity, 'on') else "mdi:delete-empty" }}
                          icon_color: *settings_toggle_icon_color
                          layout: *settings_toggle_layout
                          tap_action: *settings_toggle_tap_action
                          hold_action: *settings_toggle_hold_action
                        - type: custom:mushroom-template-card
                          entity: input_boolean.notify_trash_voice
                          primary: *settings_toggle_primary
                          secondary: "Welke container moet er naar buiten?"
                          multiline_secondary: *settings_toggle_multiline_secondary
                          icon: |-
                            {{ "mdi:account-voice" if is_state(entity, 'on') else "mdi:account-voice-off" }}
                          icon_color: *settings_toggle_icon_color
                          layout: *settings_toggle_layout
                          tap_action: *settings_toggle_tap_action
                          hold_action: *settings_toggle_hold_action
                        - type: custom:mushroom-template-card
                          entity: input_boolean.notify_dishwasher
                          primary: *settings_toggle_primary
                          secondary: "Wanneer kan de vaatwasser aan?"
                          multiline_secondary: *settings_toggle_multiline_secondary
                          icon: |-
                            {{ "mdi:dishwasher" if is_state(entity, 'on') else "mdi:dishwasher-off" }}
                          icon_color: *settings_toggle_icon_color
                          layout: *settings_toggle_layout
                          tap_action: *settings_toggle_tap_action
                          hold_action: *settings_toggle_hold_action
                        - type: custom:mushroom-template-card
                          entity: input_boolean.enable_pir_gang_automations
                          primary: *settings_toggle_primary
                          secondary: "Lamp gang automatisch aan?"
                          multiline_secondary: *settings_toggle_multiline_secondary
                          icon: |-
                            {{ "mdi:motion-sensor" if is_state(entity, 'on') else "mdi:motion-sensor-off" }}
                          icon_color: *settings_toggle_icon_color
                          layout: *settings_toggle_layout
                          tap_action: *settings_toggle_tap_action
                          hold_action: *settings_toggle_hold_action
                        - type: custom:mushroom-template-card
                          entity: input_boolean.enable_pir_inloopkast_automations
                          primary: *settings_toggle_primary
                          secondary: "Lamp inloopkast automatisch aan?"
                          multiline_secondary: *settings_toggle_multiline_secondary
                          icon: |-
                            {{ "mdi:motion-sensor" if is_state(entity, 'on') else "mdi:motion-sensor-off" }}
                          icon_color: *settings_toggle_icon_color
                          layout: *settings_toggle_layout
                          tap_action: *settings_toggle_tap_action
                          hold_action: *settings_toggle_hold_action
                        - type: custom:mushroom-template-card
                          entity: input_boolean.enable_pir_bijkeuken_automations
                          primary: *settings_toggle_primary
                          secondary: "Lamp bijkeuken automatisch aan?"
                          multiline_secondary: *settings_toggle_multiline_secondary
                          icon: |-
                            {{ "mdi:motion-sensor" if is_state(entity, 'on') else "mdi:motion-sensor-off" }}
                          icon_color: *settings_toggle_icon_color
                          layout: *settings_toggle_layout
                          tap_action: *settings_toggle_tap_action
                          hold_action: *settings_toggle_hold_action
                        - type: custom:mushroom-template-card
                          entity: input_boolean.enable_woonkamer_sunset_automations
                          primary: *settings_toggle_primary
                          secondary: "Lamp vaas aan bij sunset?"
                          multiline_secondary: *settings_toggle_multiline_secondary
                          icon: |-
                            {{ "mdi:weather-sunset-down" if is_state(entity, 'on') else "mdi:weather-sunset" }}
                          icon_color: *settings_toggle_icon_color
                          layout: *settings_toggle_layout
                          tap_action: *settings_toggle_tap_action
                          hold_action: *settings_toggle_hold_action
                        - type: custom:mushroom-template-card
                          entity: input_boolean.vacation_mode_away
                          primary: *settings_toggle_primary
                          secondary: "Vakantieverlichting"
                          multiline_secondary: *settings_toggle_multiline_secondary
                          icon: mdi:island
                          icon_color: *settings_toggle_icon_color
                          layout: *settings_toggle_layout
                          tap_action: *settings_toggle_tap_action
                          hold_action: *settings_toggle_hold_action
                        - type: custom:mushroom-template-card
                          entity: automation.garden_backgate_alert
                          primary: *settings_toggle_primary
                          secondary: "Poort alarm?"
                          multiline_secondary: *settings_toggle_multiline_secondary
                          icon: |-
                            {{ "mdi:bell-outline" if is_state(entity, 'on') else "mdi:bell-off-outline" }}
                          icon_color: *settings_toggle_icon_color
                          layout: *settings_toggle_layout
                          tap_action: *settings_toggle_tap_action
                          hold_action: *settings_toggle_hold_action
          - type: template
            icon: mdi:refresh-circle
            icon_color: grey
            tap_action:
              action: fire-dom-event
              uix:
                action: clear-cache

      - type: heading
        heading: Zwembad
        icon: mdi:pool
        uix:
          style:
            hui-heading-badge:nth-child(1) hui-entity-heading-badge$: |
              ha-heading-badge {
                {% set pool_temperature_entity = 'sensor.pool_controller_watertemperatuur' %}
                {% if not has_value(pool_temperature_entity) %}
                  --icon-color: var(--secondary-text-color) !important;
                {% elif states(pool_temperature_entity) | float > 29 %}
                  --icon-color: var(--orange-color) !important;
                {% elif states(pool_temperature_entity) | float >= 27 %}
                  --icon-color: var(--yellow-color) !important;
                {% elif states(pool_temperature_entity) | float < 22 %}
                  --icon-color: var(--blue-color) !important;
                {% else %}
                  --icon-color: var(--green-color) !important;
                {% endif %}
              }
        badges:
          - type: entity
            entity: sensor.pool_controller_watertemperatuur
            icon: mdi:thermometer-water
            tap_action:
              action: more-info
          - type: button
            icon: mdi:test-tube
            color: purple
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: PoolLab
                  content:
                    title: PoolLab
                    show_date: true
                    show_target: true
                    type: custom:poollab-card
                    measurements: 3
                    entities:
                      - entity: sensor.zwembad_1_pl_ph
                      - entity: sensor.zwembad_1_pl_chlorine_free
                        min: 0.1
                        max: 0.4
                      - entity: sensor.zwembad_1_pl_chlorine_total
                        min: 0.1
                        max: 0.4
                      - entity: sensor.zwembad_1_pl_cyanuric_acid
                        max: 0
                      - entity: sensor.zwembad_1_pl_alkalinity
                        min: 100
                        max: 150
                      - entity: sensor.zwembad_1_pl_chlorine_combined
                        min: 0
                        max: 1
          - type: button
            icon: mdi:cog
            color: grey
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Poolcontroller instellingen
                  content:
                    type: vertical-stack
                    cards:
                      - type: heading
                        heading: Watervulling
                        icon: mdi:water-plus
                      - type: grid
                        columns: 2
                        square: false
                        cards:
                          - type: custom:mushroom-number-card
                            entity: number.schuur_pool_controller_watervulling_duur
                            name: Vulduur
                            icon: mdi:timer-cog
                            display_mode: buttons
                          - type: conditional
                            conditions:
                              - entity: switch.pool_controller_watervulling
                                state: "off"
                            card:
                              type: custom:mushroom-template-card
                              entity: switch.pool_controller_watervulling
                              primary: Watervulling starten
                              secondary: >-
                                Ingesteld op {{ states('number.schuur_pool_controller_watervulling_duur', with_unit=True) }}
                              icon: mdi:water-plus
                              icon_color: blue
                              tap_action:
                                action: perform-action
                                perform_action: switch.turn_on
                                target:
                                  entity_id: switch.pool_controller_watervulling
                                confirmation:
                                  text: Weet je zeker dat je de watervulling wilt starten?
                              hold_action:
                                action: more-info
                          - type: conditional
                            conditions:
                              - entity: switch.pool_controller_watervulling
                                state: "on"
                            card:
                              type: custom:mushroom-template-card
                              entity: switch.pool_controller_watervulling
                              primary: Watervulling stoppen
                              secondary: >-
                                Nog {{ states('sensor.pool_controller_watervulling_resterende_tijd', with_unit=True) }}
                              icon: mdi:water-minus
                              icon_color: red
                              tap_action:
                                action: perform-action
                                perform_action: switch.turn_off
                                target:
                                  entity_id: switch.pool_controller_watervulling
                              hold_action:
                                action: more-info

                      - type: heading
                        heading: Pompplanning
                        icon: mdi:calendar-clock
                      - type: grid
                        columns: 2
                        square: false
                        cards:
                          - type: custom:mushroom-entity-card
                            entity: switch.pool_controller_pomp_automatisch_schema
                            name: Automatisch pompschema
                            icon: mdi:calendar-clock
                            tap_action:
                              action: toggle
                            hold_action:
                              action: more-info
                          - type: custom:mushroom-template-card
                            primary: Zwembadapparatuur
                            secondary: >-
                              {{ "Actief" if states('sensor.zwembad_apparatuur_power') | float(0) > 100 else "Stand-by" }} - {{ states('sensor.zwembad_apparatuur_power', with_unit=True) }}
                            entity: switch.zwembad_apparatuur
                            icon: mdi:power-plug
                            icon_color: >-
                              {{ "green" if states('sensor.zwembad_apparatuur_power') | float(0) > 100 else "yellow" }}
                            multiline_secondary: true
                            tap_action:
                              action: more-info
                      - type: grid
                        columns: 2
                        square: false
                        cards:
                          - type: custom:mushroom-entity-card
                            entity: time.schuur_pool_controller_pomp_starttijd
                            name: Starttijd
                            icon: mdi:clock-start
                            tap_action:
                              action: more-info
                          - type: custom:mushroom-entity-card
                            entity: time.schuur_pool_controller_pomp_stoptijd
                            name: Stoptijd
                            icon: mdi:clock-end
                            tap_action:
                              action: more-info

                      - type: heading
                        heading: Status
                        icon: mdi:information-outline
                      - type: custom:mushroom-template-card
                        entity: switch.pool_controller_ionisator
                        primary: Ionisator
                        secondary: >-
                          Alleen-lezen - {{ state_translated(entity) }}
                        icon: mdi:atom
                        icon_color: >-
                          {{ "purple" if is_state(entity, 'on') else "grey" }}
                        tap_action:
                          action: none
                        hold_action:
                          action: none
                        double_tap_action:
                          action: none

      - type: custom:mushroom-cover-card
        entity: cover.pool_controller_roldeck
        name: Roldek
        layout: horizontal
        show_position_control: false
        show_buttons_control: true

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: switch.pool_controller_verlichting
            primary: Verlichting
            secondary: "{{ state_translated(entity) }}"
            icon: mdi:lightbulb
            icon_color: >-
              {{ "amber" if is_state(entity, 'on') else "grey" }}
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: switch.pool_controller_pomp
            primary: Pomp
            secondary: >-
              {{ state_translated(entity) }} - {{ states('select.schuur_pool_controller_pomp_modus') }}
            icon: mdi:pump
            icon_color: >-
              {{ "green" if is_state(entity, 'on') else "grey" }}
            multiline_secondary: true
            tap_action:
              action: toggle
              confirmation:
                text: Weet je zeker dat je de pomp handmatig wil bedienen?
            hold_action:
              action: more-info

      - type: heading
        heading: Tuin
        icon: mdi:flower
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-light-card
            entity: light.tuin_spot_boom
          - type: custom:mushroom-light-card
            entity: light.verlichting_tuin
            icon: phu:wall-resonate
          - type: custom:mushroom-entity-card
            entity: binary_sensor.poort_contact
          - type: custom:mushroom-entity-card
            entity: binary_sensor.fietsenhok_contact
          - type: custom:mushroom-template-card
            primary: "Fietslader links"
            secondary: >-
              {{ state_translated('switch.fietslader_links') }}
              {{" - " ~ states('sensor.fietslader_links_power', with_unit=True) if is_state('switch.fietslader_links','on') }}
            entity: switch.fietslader_links
            icon: mdi:bicycle-electric
            icon_color: >-
              {{ "green" if is_state('switch.fietslader_links','on') else "disabled" }}
            tap_action:
              action: more-info
            hold_action:
              action: toggle
          - type: custom:mushroom-template-card
            primary: "Fietslader rechts"
            secondary: >-
              {{ state_translated('switch.fietslader_rechts') }}
              {{" - " ~ states('sensor.fietslader_rechts_power', with_unit=True) if is_state('switch.fietslader_rechts','on') }}
            entity: switch.fietslader_rechts
            icon: mdi:bicycle-electric
            icon_color: >-
              {{ "green" if is_state('switch.fietslader_rechts','on') else "disabled" }}
            tap_action:
              action: more-info
            hold_action:
              action: toggle

      - type: heading
        heading: Overige verlichting
        icon: mdi:lightbulb
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-light-card
            entity: light.badkamer
            icon: mdi:shower
            show_brightness_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: switch.schuur
            icon: mdi:greenhouse

      - type: heading
        heading: Pakketbrievenbus
        icon: mdi:package-check
      - !include common/pakketbrievenbus-card.yaml
