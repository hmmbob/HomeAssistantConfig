type: custom:mushroom-template-card
entity: sensor.weer_thuis_waarschuwingscode
primary: >-
  {% set code = states('sensor.weer_thuis_waarschuwingscode') | lower %}
  {% if code in ['red', 'rood'] %}
    Code rood
  {% elif code in ['orange', 'oranje'] %}
    Code oranje
  {% elif code in ['yellow', 'geel'] %}
    Code geel
  {% else %}
    Weerwaarschuwing
  {% endif %}
secondary: >-
  {% set warnings = state_attr('sensor.weer_thuis_waarschuwingen', 'alerts') or state_attr('sensor.weer_thuis_waarschuwingen', 'warnings') or [] %}
  {% set text = states('sensor.weer_thuis_waarschuwingen') | trim %}
  {% if warnings | count > 0 %}
    {% set first = warnings[0] %}
    {% set detail = (first.description | default('', true) | trim or first.headline | default('', true) | trim) if first is mapping else first %}
    {{ (detail if detail | length <= 110 else detail[:107] ~ '...') or 'Geen aanvullende details beschikbaar' }}
  {% elif text not in ['', 'unknown', 'unavailable', 'none'] %}
    {% set first = text.split('. ')[0] %}
    {{ first if first | length <= 110 else first[:107] ~ '...' }}
  {% else %}
    Waarschuwingsdetails zijn tijdelijk niet beschikbaar
  {% endif %}
icon: mdi:alert-circle-outline
icon_color: >-
  {% set code = states('sensor.weer_thuis_waarschuwingscode') | lower %}
  {% if code in ['red', 'rood'] %}
    red
  {% elif code in ['orange', 'oranje'] %}
    orange
  {% elif code in ['yellow', 'geel'] %}
    yellow
  {% else %}
    blue
  {% endif %}
multiline_secondary: true
fill_container: true
uix:
  style:
    .: |
      ha-card {
        {% set code = states('sensor.weer_thuis_waarschuwingscode') | lower %}
        {% if code in ['red', 'rood'] %}
          background-color: rgba(244, 67, 54, 0.16) !important;
          border-color: rgba(244, 67, 54, 0.75) !important;
        {% elif code in ['orange', 'oranje'] %}
          background-color: rgba(255, 152, 0, 0.16) !important;
          border-color: rgba(255, 152, 0, 0.75) !important;
        {% elif code in ['yellow', 'geel'] %}
          background-color: rgba(255, 235, 59, 0.18) !important;
          border-color: rgba(245, 196, 0, 0.75) !important;
        {% else %}
          background-color: rgba(33, 150, 243, 0.14) !important;
          border-color: rgba(33, 150, 243, 0.65) !important;
        {% endif %}
      }
tap_action:
  action: fire-dom-event
  uix:
    action: popover
    data:
      width: large
      style: !include uix-popup-size.yaml
      target: none
      title: Weerwaarschuwing
      timeout: 20000
      card:
        type: markdown
        content: |
          {% set warning_sensor = 'sensor.weer_thuis_waarschuwingen' -%}
          {% set alerts = state_attr(warning_sensor, 'alerts') or [] -%}
          {% set titles = {'red': 'Code rood', 'orange': 'Code oranje', 'yellow': 'Code geel'} -%}
          {% if has_value(warning_sensor) and alerts -%}
          {% for alert in alerts -%}
          {% set code = alert.code | lower -%}
          {% set title = titles.get(code, 'Weerwaarschuwing') -%}
          {% set level = 'error' if code == 'red' else 'warning' if code in ['orange', 'yellow'] else 'info' -%}
          {% set headline = alert.headline | default('', true) | trim -%}
          {% set detail = alert.description | default('', true) | trim -%}
          {% set onset = as_datetime(alert.onset | default(none), none) -%}
          {% set expires = as_datetime(alert.expires | default(none), none) -%}
          {% set prefix = title | lower ~ ' voor ' -%}
          {% if not headline and (detail | lower).startswith(prefix) -%}
          {% set detail = detail[prefix | length:] | trim -%}
          {% set detail = detail[:1] | upper ~ detail[1:] -%}
          {% endif -%}
          <ha-alert alert-type="{{ level }}" title="{{ title | e }}{% if headline %} · {{ headline | e }}{% endif %}">
            {% if onset and expires -%}
            <small>Van {{ as_local(onset).strftime('%d-%m %H:%M') }} tot {{ as_local(expires).strftime('%d-%m %H:%M') }}</small>
            {% if detail %}<br>{% endif %}
            {% endif -%}
            {{ detail | e }}
          </ha-alert>

          {% endfor -%}
          {% else -%}
          {% set inactive = has_value(warning_sensor) and is_state('binary_sensor.weer_thuis_waarschuwing_actief', 'off') -%}
          <ha-alert alert-type="{{ 'success' if inactive else 'info' }}" title="Weerwaarschuwing">
            {{ 'Geen waarschuwingen actief.' if inactive else 'Waarschuwingsdetails zijn tijdelijk niet beschikbaar.' }}
          </ha-alert>
          {% endif %}
