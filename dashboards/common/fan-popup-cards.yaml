- type: custom:mushroom-fan-card
  entity: fan.open_air_mini
  name: Afzuiging
  icon_animation: true
  show_percentage_control: true
  layout: horizontal

- type: custom:mushroom-template-card
  entity: input_select.ventilation_mode
  primary: >-
    {%- set mode_names = {
      'auto': 'Automatisch',
      'manual_boost': 'Handmatige boost',
      'humidity_boost': 'Vochtigheidsboost',
      'wc_boost': 'WC-boost'
    } -%}
    {{ mode_names.get(states('input_select.ventilation_mode'), states('input_select.ventilation_mode')) }}
  secondary: >-
    {%- if states('input_select.ventilation_mode') != 'auto' -%}
      tot {{ (states('input_datetime.ventilation_boost_until') | as_datetime).strftime('%H:%M') }}
    {%- else -%}
      Automatische schema
    {%- endif -%}
  icon: >-
    {% set mode = states('input_select.ventilation_mode') %}
    {% if mode == 'manual_boost' %}
      mdi:fan-plus
    {% elif mode == 'humidity_boost' %}
      mdi:water-percent
    {% elif mode == 'wc_boost' %}
      mdi:toilet
    {% else %}
      mdi:fan
    {% endif %}
  icon_color: |-
    {% set mode = states('input_select.ventilation_mode') %}
    {% if mode == 'manual_boost' %}
      orange
    {% elif mode == 'humidity_boost' %}
      blue
    {% elif mode == 'wc_boost' %}
      purple
    {% else %}
      grey
    {% endif %}
  multiline_secondary: true
  tap_action:
    action: none
  hold_action:
    action: none

- type: custom:mushroom-chips-card
  chips:
    - type: template
      content: "Boost:"
    - type: action
      icon: mdi:fast-forward-15
      tap_action:
        action: perform-action
        perform_action: script.ventilation_manual_boost
        data:
          duration: 15
    - type: action
      icon: mdi:fast-forward-30
      tap_action:
        action: perform-action
        perform_action: script.ventilation_manual_boost
        data:
          duration: 30
    - type: action
      icon: mdi:fast-forward-60
      tap_action:
        action: perform-action
        perform_action: script.ventilation_manual_boost
        data:
          duration: 60
    - type: action
      icon: mdi:timer-off-outline
      tap_action:
        action: perform-action
        perform_action: script.ventilation_cancel_boost
    - type: conditional
      conditions:
        - entity: input_select.ventilation_mode
          state_not: auto
      chip:
        type: template
        entity: input_datetime.ventilation_boost_until
        icon: mdi:timer-sand
        content: >-
          {% from 'relative_time_plus.jinja' import relative_time_plus %}
          {{ relative_time_plus(states('input_datetime.ventilation_boost_until'),
              parts=2, time=true, abbr=true, language='nl') }}
        tap_action:
          action: none

- type: custom:mushroom-template-card
  primary: Vochtregeling
  secondary: >-
    {% from 'ventilation.jinja' import humidity_status %}
    {% set evaluate = humidity_status | as_function %}
    {% set status = evaluate() %}
    Start vanaf {{ status.start_limit | round(1) }}% of een snelle stijging.
    Herstel: alle drie ruimtes onder {{ status.stop_limit | round(1) }}% en vijf minuten rustig.
    {% if not status.reference_valid %}Binnenreferentie ontbreekt; vaste grenzen 70/65%.{% endif %}
    {% if not status.all_valid %}Een vochtmeting ontbreekt; geen voortijdige normalisatie.{% endif %}
    {% if is_state('input_boolean.ventilation_humidity_episode', 'on')
          and (state_attr('input_datetime.ventilation_humidity_until', 'timestamp') | float(0)) <= as_timestamp(now()) %}
      Automatische vochtboost wacht op herstel. Handmatig boosten blijft mogelijk.
    {% endif %}
  icon: mdi:water-percent
  multiline_secondary: true
  tap_action:
    action: none

- type: entities
  entities:
    - entity: sensor.ventilatie_referentie_luchtvochtigheid
      name: Binnenreferentie (middelste waarde)
    - entity: sensor.temp_sensor_2_badkamer_humidity
      name: Badkamer
    - entity: sensor.temp_sensor_4_badkamer_zolder_humidity
      name: Badkamer zolder
    - entity: sensor.temp_sensor_1_bijkeuken_humidity
      name: Bijkeuken
