####################
# Picnic           #
####################
path: picnic-eta
title: Picnic ETA
icon: mdi:cart
type: panel
cards:
  - type: picture-elements
    image: local/icons/picnic_background2.png
    elements:
      - type: custom:text-element
        text: "bezorgt rond"
        style:
          top: 67%
          left: 50%
          color: white
          font-size: 400%
          font-weight: bold
      - type: state-label
        entity: sensor.picnic_verwachte_bezorgtijd
        style:
          top: 85%
          left: 50%
          color: white
          font-size: 500%
          font-weight: bold
      - type: icon
        icon: mdi:close-circle
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: script.picnic_close_dashboard
            data:
              browser_id: THIS
        style:
          top: 10%
          left: 90%
          color: white
          transform: scale(3,3)
