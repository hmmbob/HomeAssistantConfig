type: conditional
conditions:
  - entity: input_boolean.pakketbrievenbus_bevat_pakket
    state: "on"
chip:
  type: template
  entity: counter.pakketbrievenbus_pakketten_aanwezig
  icon: mdi:package-variant-closed
  icon_color: green
  content: >-
    {{ states(entity) }}
  tap_action:
    action: fire-dom-event
    uix:
      action: popover
      data:
        width: full
        uix: !include uix-popup-fullscreen.yaml
        target: none
        title: Pakketbrievenbus
        timeout: 15000
        buttons:
          primary:
            label: Sluiten
        card: !include ../../common/pakketbrievenbus-card.yaml
  uix:
    style: |
      ha-card {
        --chip-background: transparent;
        --chip-border-color: transparent;
        --chip-box-shadow: none;
      }
