####################
# Salon    #
####################
path: salon
title: Salon
icon: mdi:sofa
visible: false
cards:
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Salon
        alignment: justify
      - type: custom:mushroom-chips-card
        chips:
          - type: template
            tap_action:
              action: navigate
              navigation_path: /lovelace/start
            icon: mdi:arrow-left
          - type: entity
            entity: sensor.salon_temperatuur
            icon_color: orange
          - type: entity
            entity: sensor.tado_smart_thermostat_su1864388608_current_humidity
            icon_color: indigo
          - type: template
            entity: light.alle_lampen_salon
            icon: mdi:lightbulb-group
            icon_color: |-
              {{ "orange" if is_state('light.alle_lampen_salon', 'on') else "grey" }}
            content: |-
              {{ expand(state_attr('light.alle_lampen_salon', 'entity_id')) | selectattr('state','eq','on') |
                  map(attribute='entity_id') | list | count }}

      - type: custom:mushroom-light-card
        entity: light.salon
        icon: mdi:ceiling-light-multiple
        show_brightness_control: true
        collapsible_controls: true

      - type: horizontal-stack
        cards:
          - type: custom:mushroom-light-card
            entity: light.staande_lamp_switch
            icon: mdi:floor-lamp
            fill_container: false
            show_brightness_control: false
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.kast
            icon: mdi:cupboard
            fill_container: false
            show_brightness_control: false
            collapsible_controls: true

      - type: horizontal-stack
        cards:
          - type: custom:mushroom-light-card
            entity: switch.grijze_lamp
            icon: mdi:lamp
            show_brightness_control: false
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.tv_kastje
            icon: mdi:television
            fill_container: false
            show_brightness_control: false
            collapsible_controls: true

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: climate.smart_bladeless_fan_heater
            name: Heater
            icon: mdi:heat-wave
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
            features:
              - type: target-temperature
            features_position: bottom
            hide_state: false
            visibility:
              - condition: user
                users:
                  - 40059eb4e4d142688185485ed2e1ebbb
                  - 510b1afef60640d7a220711c50b2192a
          - type: tile
            entity: climate.salon
            name: Tado
            icon: phu:tado
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
            features:
              - type: target-temperature
            features_position: bottom
            hide_state: false
            visibility:
              - condition: user
                users:
                  - 40059eb4e4d142688185485ed2e1ebbb
                  - 510b1afef60640d7a220711c50b2192a

      - type: custom:mini-media-player
        entity: media_player.tv_salon
        icon: phu:youtube-tv
        artwork: cover
        artwork_border: true
        power_color: true
        scroll_info: true
        show_source: true

      - type: custom:mini-media-player
        entity: media_player.soundbar
        icon: phu:play-bar-one
        artwork: cover
        artwork_border: true
        power_color: true
        scroll_info: true
        show_source: true
