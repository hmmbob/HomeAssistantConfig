path: solar
title: Solar
icon: mdi:solar-power
type: masonry
cards:
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Solar
        alignment: justify
      - type: glance
        columns: 3
        state_color: true
        show_name: true
        show_state: true
        entities:
          - entity: sensor.pv_power
            name: PV-vermogen
          - entity: number.grid_export_limit
            name: Terugleverlimiet
            tap_action:
              action: more-info
          - entity: binary_sensor.negatieve_stroomprijs
            name: Negatieve prijs
      - type: heading
        heading: Automatisch regelen
        heading_style: title
        icon: mdi:refresh-auto
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: input_boolean.solar_pv_off_automatic
            name: Negatieve prijs
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
          - type: tile
            entity: input_boolean.solar_pv_off_schedule
            name: Eenmalig tijdschema
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
      - type: heading
        heading: Uitschakelperiode
        heading_style: title
        icon: mdi:calendar-clock
      - type: entities
        show_header_toggle: false
        entities:
          - entity: input_datetime.solar_pv_off_start
            name: Begin
          - entity: input_datetime.solar_pv_off_end
            name: Einde
      - type: shortcut
        label: Regeling & laatste uitvoering
        icon: mdi:robot
        tap_action:
          action: more-info
          entity: automation.solar_handle_pf_off_time
